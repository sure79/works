<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>한 계절 프로젝트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 숲의 한 계절: 좁은 한 줄 기둥. 오늘 탭이 매일의 허브, 나무가 시즌의 진전을 보여 준다 */
:root{
  --bg:#F1F3EC; --surface:#FAFBF7; --fg:#1C231E; --muted:#5B665D; --line:#D6DBCF;
  --moss:#2E6A4C; --moss-soft:#DCE9DF; --amber:#B8661F; --amber-soft:#F5E4D2; --danger:#A33B2E; --bark:#7B5A3C;
  --amber-deep:#96501A; --seed:#EFD3A0; --seed-2:#D6AE70; --ink:#2B2522; --blush:#EFA096; --shine:#FFFFFF;
  --scrim:rgba(24,32,26,.55); --sky1:#D9E9EE; --sky2:#EEF3E6; --eve1:#F2D6C0; --eve2:#EFE7D6; --night1:#26344A; --night2:#394659; --ground:#C7D7BC;
  --display:"Gowun Batang","Nanum Myeongjo",Georgia,serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121613; --surface:#1A201C; --fg:#E4EAE2; --muted:#9AA79D; --line:#2E3830;
  --moss:#7EC39C; --moss-soft:#213A2C; --amber:#E2A263; --amber-soft:#3A2C1E; --danger:#E68373; --bark:#B8906A;
  --amber-deep:#C0823F; --seed:#E6C68E; --seed-2:#C9A266; --blush:#DC8C84;
  --scrim:rgba(0,0,0,.62); --sky1:#1C2A30; --sky2:#1A2420; --eve1:#3A2A24; --eve2:#28231F; --night1:#0F1520; --night2:#18202B; --ground:#243020; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121613; --surface:#1A201C; --fg:#E4EAE2; --muted:#9AA79D; --line:#2E3830;
  --moss:#7EC39C; --moss-soft:#213A2C; --amber:#E2A263; --amber-soft:#3A2C1E; --danger:#E68373; --bark:#B8906A;
  --amber-deep:#C0823F; --seed:#E6C68E; --seed-2:#C9A266; --blush:#DC8C84;
  --scrim:rgba(0,0,0,.62); --sky1:#1C2A30; --sky2:#1A2420; --eve1:#3A2A24; --eve2:#28231F; --night1:#0F1520; --night2:#18202B; --ground:#243020; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.65 var(--body)}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:28px 64px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:1.9rem}
h2{font-size:1.35rem}
h3{font-size:1.05rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.center{text-align:center}
.eyebrow{font-size:.75rem;letter-spacing:.08em;color:var(--muted);font-weight:600}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.status{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--moss)}
.dot.wait{background:var(--amber)}
.stack{display:flex;flex-direction:column;gap:16px;padding-top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.season-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.season-head > div{min-width:0}
.bigweek{font-family:var(--mono);font-size:2rem;line-height:1;color:var(--moss)}
.bigweek small{font-size:.9rem;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 20px;margin:0}
.facts dt{font-size:.75rem;color:var(--muted);letter-spacing:.04em}
.facts dd{margin:0;overflow-wrap:anywhere}
.weeks{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:4px}
.wk{height:30px;border-radius:4px;border:1px solid var(--line);display:grid;place-items:center;font:500 .72rem var(--mono);color:var(--muted)}
.wk.past{background:var(--line)}
.wk.done{background:var(--moss);border-color:var(--moss);color:var(--surface)}
.wk.now{outline:2px solid var(--amber);outline-offset:1px;color:var(--fg)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;border:1px solid var(--line);display:inline-block}
.mini{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.mini b{font-family:var(--display);overflow-wrap:anywhere}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;font:500 .92rem var(--body);color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--moss)}
.tabs .count{font-family:var(--mono);font-size:.72rem;margin-left:4px;background:var(--amber-soft);color:var(--amber);border-radius:99px;padding:0 6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{font:500 .88rem var(--body);border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:99px;padding:6px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--moss);border-color:var(--moss);color:var(--surface)}
form{display:flex;flex-direction:column;gap:14px}
label{display:flex;flex-direction:column;gap:5px;font-weight:500;font-size:.9rem}
label.inline{flex-direction:row;align-items:flex-start;gap:8px;font-weight:400}
label .hint{font-weight:400;color:var(--muted);font-size:.8rem}
.lbl{font-size:.9rem;font-weight:500}
input[type=text],input[type=date],textarea,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 11px;width:100%}
textarea{min-height:64px;resize:vertical}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--moss);outline-offset:2px}
fieldset.woop{border:1px dashed var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:12px;margin:0;min-width:0}
fieldset.woop legend{font-weight:600;padding:0 6px;font-size:.9rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row > *{flex:1 1 180px;min-width:0}
.choices{display:flex;gap:8px;flex-wrap:wrap}
.choices label{flex-direction:row;align-items:center;gap:6px;font-weight:400;border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
.choices label:has(input:checked){border-color:var(--moss);background:var(--moss-soft)}
.btn{font:600 .9rem var(--body);border-radius:6px;padding:9px 16px;cursor:pointer;border:1px solid var(--moss);background:var(--moss);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--moss)}
.btn.warn{background:var(--amber);border-color:var(--amber)}
.btn.link{border:0;background:none;padding:4px 6px;color:var(--muted);font-weight:500}
.btn.link:hover{color:var(--moss)}
.btn.link.danger:hover{color:var(--danger)}
.item-actions{display:flex;flex:0 0 auto}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{background:var(--moss-soft);border-radius:8px;padding:12px 14px;font-size:.88rem}
.note.warn{background:var(--amber-soft)}
.why{font-size:.8rem;color:var(--muted);border-left:2px solid var(--line);padding-left:10px}
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ul.list li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
ul.list li:first-child{border-top:0}
ul.list li .grow{flex:1;min-width:0;overflow-wrap:anywhere}
ul.list li.done .grow > .t{color:var(--muted);text-decoration:line-through}
.cue{font-size:.8rem;color:var(--moss)}
input[type=checkbox],input[type=radio]{accent-color:var(--moss);width:17px;height:17px;margin-top:3px;flex:0 0 auto}
.pill{display:inline-block;font-size:.72rem;padding:1px 8px;border-radius:99px;background:var(--line);color:var(--fg)}
.pill.moss{background:var(--moss-soft);color:var(--moss)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.entry{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.entry:first-child{border-top:0;padding-top:0}
.entry dl{margin:0;display:grid;grid-template-columns:minmax(90px,max-content) 1fr;gap:4px 12px;font-size:.9rem}
.entry dt{color:var(--muted)}
.entry dd{margin:0;overflow-wrap:anywhere}
.pitch{font-family:var(--display);font-size:1.25rem;line-height:1.6;padding:18px;border:1px dashed var(--moss);border-radius:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stats div{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stats b{display:block;font:500 1.3rem var(--mono)}
.q{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile.tree{flex-direction:row;align-items:center;gap:12px}
.tile.tree > div{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.tree svg{width:84px;height:78px;flex:0 0 auto}
.t-soil{fill:var(--line)}
.t-seed,.t-fruit{fill:var(--amber)}
.t-stem,.t-leaf{fill:var(--moss)}
.t-trunk{fill:var(--bark)}
.t-canopy{fill:var(--moss);fill-opacity:.85}
.big{font:500 2rem/1 var(--mono)}
.big small{font-size:.9rem;color:var(--muted);margin-left:2px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--moss);border-radius:99px}
.bigtimer{font:500 3.4rem/1.1 var(--mono);text-align:center;color:var(--moss);margin:4px 0}
.bigtimer.over{color:var(--amber)}
.toasts{display:flex;flex-direction:column;gap:8px}
.toast{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.toast.reward{border-color:var(--amber);background:var(--amber-soft)}
.toast .rw{font-family:var(--display);font-size:1.35rem;overflow-wrap:anywhere}
.flash{border:1px solid var(--moss);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:14px;background:var(--surface)}
.flash .prompt{font-family:var(--display);font-size:1.3rem;line-height:1.5;overflow-wrap:anywhere}
.answer{background:var(--moss-soft);border-radius:8px;padding:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.mine{border:1px dashed var(--line);border-radius:8px;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate button{font:600 .88rem var(--body);border-radius:8px;padding:12px 8px;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--fg);display:flex;flex-direction:column;gap:2px;align-items:center}
.rate button small{font:400 .75rem var(--mono);color:var(--muted)}
.rate .hard{border-color:var(--amber)}
.rate .easy{border-color:var(--moss)}
.timer{font:500 1.1rem var(--mono);color:var(--amber)}
details.guide{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:14px 18px}
details.guide summary{cursor:pointer;font-weight:600}
.principles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:14px}
.principles div{border-top:2px solid var(--moss);padding-top:8px;font-size:.88rem;display:flex;flex-direction:column;gap:4px}
.principles b{font-family:var(--display);font-size:1rem}
.principles .src{font-size:.75rem;color:var(--muted)}
details.more summary{cursor:pointer;color:var(--muted);font-size:.88rem}
details.more[open] summary{margin-bottom:10px}
/* 아이콘 */
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.ic .fill{fill:currentColor;stroke:none}
.tabs button{display:inline-flex;align-items:center;gap:6px}
.tabs .tic{display:inline-flex}
.tabs .ic{width:18px;height:18px}
/* HUD: 캐릭터 · 레벨 · 연속 · 퀘스트 */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 12px 6px 6px}
.m-slot{background:none;border:0;padding:0;cursor:pointer;display:block;flex:0 0 auto;border-radius:12px}
.hud .m-slot{width:46px;height:52px}
.m-slot svg{width:100%;height:100%;overflow:visible;display:block}
.hud .lv{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.lvrow{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;align-items:baseline}
.lvbadge{font:600 .85rem var(--mono);color:var(--moss)}
.xpbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--moss);border-radius:99px}
.hud-stat{display:flex;align-items:center;gap:3px;font:600 .9rem var(--mono);flex:0 0 auto}
.hud-stat .ic{width:18px;height:18px}
.hud-stat.flame{color:var(--amber)}
/* 싹이 */
.m-body{fill:var(--seed)}
.m-foot,.m-arm{fill:var(--seed-2)}
.m-leaf,.m-stem{fill:var(--moss)}
.m-ink{fill:var(--ink)}
.m-line{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round}
.m-shine{fill:var(--shine)}
.m-hi{fill:var(--shine);opacity:.35}
.m-cheek{fill:var(--blush);opacity:.8}
.m-shadow{fill:var(--ink);opacity:.12}
.m-petal{fill:var(--blush)}
.m-flower,.m-spark{fill:var(--amber)}
.m-z{font:700 12px var(--mono);fill:var(--muted)}
/* 오늘의 마당 */
.scene{position:relative;border-radius:14px;overflow:hidden;background:linear-gradient(var(--sky1),var(--sky2));border:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:14px 14px 0;min-height:230px}
.scene.eve{background:linear-gradient(var(--eve1),var(--eve2))}
.scene.night{background:linear-gradient(var(--night1),var(--night2))}
.scene .star{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--shine);opacity:.8}
.bubble{position:relative;z-index:1;align-self:flex-start;max-width:88%;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:8px 12px;font-size:.92rem;line-height:1.5}
.bubble::after{content:"";position:absolute;left:34px;bottom:-7px;width:12px;height:12px;background:var(--surface);border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.scene-row{position:relative;z-index:1;display:flex;justify-content:space-around;align-items:flex-end;padding-top:6px}
.scene .m-slot{width:108px;height:122px}
.tree-slot svg{width:140px;height:128px;display:block}
.ground{position:absolute;left:0;right:0;bottom:0;height:30px;background:var(--ground)}
.stage-chip{position:absolute;z-index:2;right:10px;bottom:6px;display:inline-flex;align-items:center;gap:4px;font-size:.78rem;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:2px 10px}
.stage-chip .ic{width:14px;height:14px;color:var(--moss)}
/* 퀘스트 */
.qlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.qbtn{width:100%;display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;color:var(--fg);cursor:pointer;text-align:left}
.qbtn .grow{flex:1;min-width:0}
.qic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--moss-soft);color:var(--moss);flex:0 0 auto}
.qlist li.done .qbtn{border-color:var(--moss)}
.qlist li.done .qic{background:var(--moss);color:var(--surface)}
.qlist li.done .grow{color:var(--muted);text-decoration:line-through}
.chest{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted)}
.btn .ic{width:18px;height:18px;vertical-align:-4px;margin-right:4px}
/* 배지 */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px 10px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;font-size:.85rem}
.badge .small{font-size:.72rem;line-height:1.4}
.medal{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--amber-soft);color:var(--amber);border:2px solid var(--amber)}
.medal .ic{width:26px;height:26px}
.medal.locked{background:var(--bg);color:var(--muted);border:2px dashed var(--line)}
.badge.locked b{color:var(--muted)}
.medal.big{width:92px;height:92px}
.medal.big .ic{width:44px;height:44px}
.xp-rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 16px;font-size:.85rem;margin:0;padding:0;list-style:none}
.xp-rules b{font-family:var(--mono);color:var(--moss)}
/* 집중 링 */
.ring-wrap{position:relative;width:220px;height:220px;margin:0 auto;max-width:100%}
.ring{width:100%;height:100%}
.ring-bg{fill:none;stroke:var(--line);stroke-width:8}
.ring-fg{fill:none;stroke:var(--moss);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.ring-fg.over{stroke:var(--amber)}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-center .bigtimer{font-size:2.6rem;margin:0}
/* 연출 레이어 */
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.p{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px}
.p-leaf{background:var(--moss);border-radius:0 80% 0 80%}
.p-spark{background:var(--amber);border-radius:50%;width:7px;height:7px}
.p-conf{width:8px;height:12px;border-radius:2px}
.p-conf.c0{background:var(--moss)}
.p-conf.c1{background:var(--amber)}
.p-conf.c2{background:var(--blush)}
.p-conf.c3{background:var(--seed-2)}
.floater{position:absolute;font:600 .95rem var(--mono);color:var(--moss);background:var(--surface);border:1px solid var(--moss);border-radius:99px;padding:1px 10px;white-space:nowrap}
#overlay{position:fixed;inset:0;z-index:55;background:var(--scrim);display:grid;place-items:center;padding:16px}
.ov-card{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:18px;padding:24px 20px;max-width:360px;width:100%;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.ov-card .m-slot{width:130px;height:146px;cursor:default}
.ov-card .rw{font-family:var(--display);font-size:1.4rem;overflow-wrap:anywhere}
.box svg{width:150px;height:125px;overflow:visible;display:block}
.bx-base{fill:var(--amber)}
.bx-top{fill:var(--amber-deep)}
.bx-rib{fill:var(--moss)}
.bx-glow{fill:var(--amber-soft);transform-origin:60px 52px;transform:scale(0);transition:transform .5s ease-out}
.box.open .bx-glow{transform:scale(1)}
.bx-lid{transform-origin:18px 49px;transition:transform .55s cubic-bezier(.3,1.6,.5,1)}
.box.open .bx-lid{transform:translate(4px,-20px) rotate(-24deg)}

<script>
(function(){
const clone = x => JSON.parse(JSON.stringify(x));
const DEFAULT = {v:4, season:null, focus:null, later:[], pitch:{who:"",problem:"",combo:""}, archive:[], cards:[], rewards:[], earned:[], bundle:"", chests:[], badges:{}, seenLevel:null};
let S = clone(DEFAULT);
let docRef = null, ready = false, backend = "local", readOnly = false;
let tab = "today", sub = "later", reviewing = false, prefill = null, cardPrefill = null;
let session = null, timerId = null, editing = null, editingSeason = false, confirmDelete = false;
let toasts = [], undo = null, beeped = false, audioCtx = null;
let overlays = [], overlayOpen = false, moodOverride = null, moodTimer = null, lineIdx = 0;
const RING = 2 * Math.PI * 54;
/* 간격 반복: 오늘 밤 → 1일 → 3일 → 7일 → 14일 → 30일 → 60일 → 120일 */
const STEPS = [0,1,3,7,14,30,60,120];
const TABS = [["today","오늘","sun"],["season","시즌","flag"],["recall","복습","cards"],["checkin","체크인","calendar"],["reward","보상","gift"],["more","더보기","more"]];
try{
  tab = localStorage.getItem("season-tab") || "today";
  sub = localStorage.getItem("season-sub") || "later";
}catch(e){}
if(["later","pitch","archive"].includes(tab)){ sub = tab; tab = "more" }
if(!TABS.some(([k]) => k === tab)) tab = "today";

const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d };
const iso = d => { const z = new Date(d); z.setMinutes(z.getMinutes()-z.getTimezoneOffset()); return z.toISOString().slice(0,10) };
const addDays = (s, n) => { const d = new Date(s+"T00:00:00"); d.setDate(d.getDate()+n); return d };
const fmt = d => { const x = new Date(d); return `${x.getMonth()+1}월 ${x.getDate()}일` };
const fmtIso = s => fmt(s+"T00:00:00");
const mmss = n => `${Math.floor(n/60)}:${String(n%60).padStart(2,"0")}`;
const dayDiff = (a, b) => Math.round((new Date(a+"T00:00:00") - new Date(b+"T00:00:00")) / 86400000);

function fixSeason(s){
  ["milestones","supports","checkins","sessions"].forEach(k => { if(!Array.isArray(s[k])) s[k] = [] });
  s.woop = {outcome:"", obstacle:"", plan:"", ...(s.woop || {})};
}
function merge(x){
  const o = clone(DEFAULT);
  if(!x || typeof x !== "object") return o;
  const m = {...o, ...clone(x)};
  m.pitch = {...o.pitch, ...(x.pitch || {})};
  ["later","archive","cards","rewards","earned","chests"].forEach(k => { if(!Array.isArray(m[k])) m[k] = [] });
  if(!m.badges || typeof m.badges !== "object" || Array.isArray(m.badges)) m.badges = {};
  if(m.season) fixSeason(m.season);
  m.archive.forEach(fixSeason);
  m.v = 4;
  return m;
}

/* ---------- 저장 ---------- */
let saving = false, dirty = false, timer = null;
function setStatus(kind, text){ $("#status").innerHTML = `<span class="dot ${kind}"></span><span>${esc(text)}</span>` }
function where(){ return backend === "db" ? "계정에 저장됨" : "이 브라우저에만 저장됨" }
function persist(){
  if(readOnly) return;
  clearTimeout(timer); setStatus("wait","저장 중");
  timer = setTimeout(flush, 600);
}
async function flush(){
  if(saving){ dirty = true; return }
  saving = true; dirty = false;
  const body = {state: clone(S), updatedAt: new Date().toISOString()};
  try{
    if(docRef) await docRef.set(body);
    else localStorage.setItem("season-app", JSON.stringify(body.state));
    setStatus("ok", where());
  }catch(e){
    if(e && e.code === "invalid_argument" && docRef){ readOnly = true; setStatus("", "읽기 전용: 이 계획을 수정할 권한이 없습니다"); render() }
    else setStatus("", "저장하지 못했습니다. 잠시 후 다시 수정해 보세요");
  }
  saving = false;
  if(dirty) flush();
}
function commit(){ persist(); render() }

/* ---------- 계산 ---------- */
function weekNow(s){ return Math.floor(dayDiff(iso(today()), s.start) / 7) + 1 }
function clampWeek(s){ return Math.min(Math.max(weekNow(s),1), s.weeks) }
function weekLabel(s){ const w = weekNow(s); return w < 1 ? "시작 전" : w > s.weeks ? "기간 종료" : `${w} / ${s.weeks}주` }
function vague(t){ return /(공부|배우기|배우는|익히기|알아보기|관심|해보기|잘하기)/.test(t) }
function many(t){ return /[,，/]|그리고| 및 /.test(t) }
function dueCards(){ const t = iso(today()); return S.cards.filter(c => c.due <= t) }
function daysAfter(n){ return iso(addDays(iso(today()), n)) }
function nextStep(c, r){
  if(r === "hard") return 1;
  return Math.min(c.step + (r === "easy" ? 2 : 1), STEPS.length - 1);
}
/* 교차: 같은 묶음끼리 몰리지 않게 묶음별로 번갈아 낸다 */
function interleave(cards){
  const groups = {};
  cards.forEach(c => (groups[c.tag || "기타"] ||= []).push(c));
  const lists = Object.values(groups).map(g => g.sort(() => Math.random() - .5));
  const out = [];
  while(lists.some(l => l.length)) lists.forEach(l => l.length && out.push(l.shift()));
  return out.map(c => c.id);
}
function stopTimer(){ clearInterval(timerId); timerId = null }

/* 연속 기록: 무언가 한 날을 센다. 7일에 한 번은 빠진 날을 쉼표로 넘긴다 */
function activeDates(){
  const d = new Set();
  [...S.archive, ...(S.season ? [S.season] : [])].forEach(s => {
    s.sessions.forEach(x => d.add(x.date));
    s.checkins.forEach(x => d.add(x.date));
    s.milestones.forEach(m => m.doneDate && d.add(m.doneDate));
  });
  S.cards.forEach(c => c.reviews.forEach(r => d.add(r.date)));
  return d;
}
function streakInfo(){
  const d = activeDates(), cur = today(), todayActive = d.has(iso(cur));
  if(!todayActive) cur.setDate(cur.getDate() - 1);
  let count = 0, pending = null, lastForgiven = null;
  const forgiven = [];
  for(let i = 0; i < 730; i++){
    const k = iso(cur);
    if(d.has(k)){
      count++;
      if(pending){ forgiven.push(pending); lastForgiven = pending; pending = null }
    } else {
      if(pending) break;
      if(lastForgiven && dayDiff(lastForgiven, k) < 7) break;
      pending = k;
    }
    cur.setDate(cur.getDate() - 1);
  }
  return {count, todayActive, forgiven, ever: d.size > 0};
}

/* 성장 점수: 기록에서 계산한다 (따로 저장하지 않음) */
function seasonXP(s){
  return s.milestones.filter(m => m.done).length * 30
    + s.sessions.reduce((n,x) => n + 10 + (x.full ? 5 : 0), 0)
    + s.checkins.reduce((n,c) => n + 20 + (c.solo ? 10 : 0), 0);
}
function points(s){ return seasonXP(s) + S.cards.reduce((n,c) => n + c.reviews.filter(r => r.date >= s.start).length, 0) * 3 }
function totalXP(){
  const seasons = [...S.archive, ...(S.season ? [S.season] : [])];
  return seasons.reduce((n,s) => n + seasonXP(s), 0) + S.cards.reduce((n,c) => n + c.reviews.length, 0) * 3
    + S.chests.length * 20 + Object.keys(S.badges).length * 15;
}
function levelInfo(xp){
  let L = 1, need = 50;
  while(xp >= need){ xp -= need; L++; need = 50 + 30 * (L - 1) }
  return {L, into:xp, need};
}
function stageNow(){ return S.season ? stageOf(points(S.season)).i : 0 }
const STAGES = [[0,"씨앗"],[40,"새싹"],[120,"묘목"],[260,"어린 나무"],[480,"나무"],[800,"열매 맺은 나무"]];
function stageOf(p){
  let i = 0; STAGES.forEach(([t],k) => { if(p >= t) i = k });
  const next = STAGES[i+1];
  return {i, name:STAGES[i][1], prev:STAGES[i][0], next: next ? next[0] : null, nextName: next ? next[1] : null};
}
function treeSVG(i){
  const soil = `<ellipse class="t-soil" cx="60" cy="102" rx="48" ry="6"/>`;
  if(i === 0) return soil + `<ellipse class="t-seed" cx="60" cy="97" rx="6" ry="4"/>`;
  const leaf = ([x,y,r]) => `<ellipse class="t-leaf" cx="${x}" cy="${y}" rx="8" ry="4" transform="rotate(${r} ${x} ${y})"/>`;
  if(i === 1) return soil + `<rect class="t-stem" x="59" y="84" width="2.5" height="16" rx="1"/>` + [[53,84,-20],[67,82,20]].map(leaf).join("");
  if(i === 2) return soil + `<rect class="t-stem" x="58.5" y="60" width="3" height="40" rx="1.5"/>` + [[51,82,-20],[69,78,20],[52,68,-25],[68,64,25],[60,56,0]].map(leaf).join("");
  const T = {
    3:[57,64,6,38,[[60,56,15],[48,63,10],[72,63,10]]],
    4:[56,56,8,46,[[60,42,19],[43,54,13],[77,54,13],[51,32,12],[69,32,12]]],
    5:[55,52,10,50,[[60,36,22],[39,50,15],[81,50,15],[47,24,14],[73,24,14],[60,16,12]]]
  }[i];
  let out = soil + `<rect class="t-trunk" x="${T[0]}" y="${T[1]}" width="${T[2]}" height="${T[3]}" rx="2"/>` +
    T[4].map(([x,y,r]) => `<circle class="t-canopy" cx="${x}" cy="${y}" r="${r}"/>`).join("");
  if(i === 5) out += [[48,46],[70,40],[62,56],[80,52],[44,32],[66,24]].map(([x,y]) => `<circle class="t-fruit" cx="${x}" cy="${y}" r="3"/>`).join("");
  return out;
}

/* ---------- 아이콘 ---------- */
const ICONS = {
  sun:`<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>`,
  flag:`<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>`,
  cards:`<rect x="4" y="7" width="12" height="14" rx="2"/><path d="M8 3h10a2 2 0 0 1 2 2v12"/>`,
  calendar:`<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M9 15l2 2 4-4"/>`,
  gift:`<rect x="3" y="9" width="18" height="12" rx="1.5"/><path d="M3 13h18M12 9v12M12 9C10 5 6 5 6 7.5S10 9 12 9c2 0 6 1 6-1.5S14 5 12 9"/>`,
  more:`<circle class="fill" cx="5" cy="12" r="1.7"/><circle class="fill" cx="12" cy="12" r="1.7"/><circle class="fill" cx="19" cy="12" r="1.7"/>`,
  flame:`<path d="M12 3c1 4 5 5.5 5 10.5a5 5 0 0 1-10 0c0-3 1.5-4.5 2-6.5 1.5 1 2.5 2.5 2.5 2.5s1.5-3 .5-6.5z"/>`,
  star:`<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>`,
  leaf:`<path d="M5 19C5 11 11 5 19 5c0 8-6 14-14 14zM5 19l7-7"/>`,
  timer:`<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/>`,
  trophy:`<path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H4v1a3 3 0 0 0 4 3M16 6h4v1a3 3 0 0 1-4 3M12 13v4M8 21h8M9 17h6"/>`,
  lock:`<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>`,
  check:`<path d="M5 12.5l4.5 4.5L19 7.5"/>`
};
const icon = n => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ""}</svg>`;

/* ---------- 싹이: 이 앱의 캐릭터. 나무 단계에 따라 잎이 자라고, 상태에 따라 표정이 바뀐다 ---------- */
const MOODNAME = {happy:"기분 좋음", cheer:"신남", sleepy:"졸림", focus:"집중", worried:"걱정"};
function mascotSVG(stage, mood){
  const leaf = ([x,y,rx,ry,r]) => `<ellipse class="m-leaf" cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" transform="rotate(${r} ${x} ${y})"/>`;
  let top;
  if(stage === 0) top = `<circle class="m-leaf" cx="50" cy="27" r="4.5"/>`;
  else {
    const L = stage >= 3 ? [[39,18,12,5.5,-28],[61,16,12,5.5,28]] : [[41,19,9,4.5,-30],[59,17,9,4.5,30]];
    if(stage >= 2) L.push([50,11,6,3.5,-90]);
    if(stage >= 5) L.push([33,26,8,4,-55],[67,24,8,4,55]);
    top = `<rect class="m-stem" x="48.8" y="17" width="2.4" height="15" rx="1.2"/>` + L.map(leaf).join("");
    if(stage >= 4) top += [0,72,144,216,288].map(r => `<ellipse class="m-petal" cx="50" cy="4" rx="2.4" ry="3.6" transform="rotate(${r} 50 9)"/>`).join("") + `<circle class="m-flower" cx="50" cy="9" r="2.8"/>`;
  }
  const arms = mood === "cheer"
    ? `<ellipse class="m-arm" cx="16" cy="54" rx="5" ry="9" transform="rotate(-35 16 54)"/><ellipse class="m-arm" cx="84" cy="54" rx="5" ry="9" transform="rotate(35 84 54)"/>`
    : `<ellipse class="m-arm" cx="15" cy="75" rx="5" ry="8" transform="rotate(20 15 75)"/><ellipse class="m-arm" cx="85" cy="75" rx="5" ry="8" transform="rotate(-20 85 75)"/>`;
  const eye = x => `<ellipse class="m-ink" cx="${x}" cy="62" rx="4.2" ry="5.2"/><circle class="m-shine" cx="${x+1.4}" cy="60" r="1.5"/>`;
  const open = `<g class="m-eyes">${eye(38)}${eye(62)}</g>`;
  const star = (x,y) => `<path class="m-spark" d="M${x} ${y-6}L${x+1.6} ${y-1.6}L${x+6} ${y}L${x+1.6} ${y+1.6}L${x} ${y+6}L${x-1.6} ${y+1.6}L${x-6} ${y}L${x-1.6} ${y-1.6}Z"/>`;
  let eyes = open, mouth = `<path class="m-line" d="M43 73 Q50 80 57 73"/>`, extra = "";
  if(mood === "cheer"){
    eyes = `<path class="m-line" d="M33 64 Q38 57 43 64"/><path class="m-line" d="M57 64 Q62 57 67 64"/>`;
    mouth = `<path class="m-ink" d="M42 72 Q50 86 58 72 Z"/>`;
    extra = star(12,34) + star(90,40) + star(20,96);
  } else if(mood === "sleepy"){
    eyes = `<path class="m-line" d="M33 63 Q38 66 43 63"/><path class="m-line" d="M57 63 Q62 66 67 63"/>`;
    mouth = `<ellipse class="m-ink" cx="50" cy="76" rx="2.6" ry="3"/>`;
    extra = `<text class="m-z" x="76" y="34">z</text><text class="m-z m-z2" x="84" y="24">z</text>`;
  } else if(mood === "focus"){
    eyes = open + `<path class="m-line" d="M32 53 L43 56"/><path class="m-line" d="M68 53 L57 56"/>`;
    mouth = `<path class="m-line" d="M45 76 L55 76"/>`;
  } else if(mood === "worried"){
    eyes = open + `<path class="m-line" d="M32 55 L43 52"/><path class="m-line" d="M68 55 L57 52"/>`;
    mouth = `<path class="m-line" d="M44 78 Q47 75 50 78 Q53 81 56 78"/>`;
  }
  return `<svg viewBox="0 0 100 112" class="mascot ${mood}" role="img" aria-label="싹이 (${MOODNAME[mood] || ""})">
    <ellipse class="m-shadow" cx="50" cy="108" rx="26" ry="3.5"/>
    <g class="m-bob">
      <ellipse class="m-foot" cx="38" cy="103" rx="9" ry="4.5"/><ellipse class="m-foot" cx="62" cy="103" rx="9" ry="4.5"/>
      ${arms}
      <path class="m-body" d="M50 31 C75 31 86 50 86 70 C86 93 70 104 50 104 C30 104 14 93 14 70 C14 50 25 31 50 31 Z"/>
      <ellipse class="m-hi" cx="40" cy="48" rx="10" ry="6" transform="rotate(-20 40 48)"/>
      <g class="m-leaves">${top}</g>
      ${eyes}${mouth}
      <ellipse class="m-cheek" cx="29" cy="71" rx="5.5" ry="3.2"/><ellipse class="m-cheek" cx="71" cy="71" rx="5.5" ry="3.2"/>
      ${extra}
    </g></svg>`;
}
function baseMood(){
  if(!S.season) return "happy";
  if(S.focus) return "focus";
  const st = streakInfo(), h = new Date().getHours();
  if(st.todayActive) return "happy";
  if(h < 10) return "sleepy";
  if(h >= 19 && st.count > 0) return "worried";
  return "happy";
}
const mood = () => moodOverride || baseMood();
function updateMascots(){ document.querySelectorAll("[data-mascot]").forEach(el => { el.innerHTML = mascotSVG(stageNow(), mood()) }) }
function cheer(ms = 2400){
  moodOverride = "cheer"; updateMascots(); clearTimeout(moodTimer);
  moodTimer = setTimeout(() => { moodOverride = null; updateMascots() }, ms);
}

const reduced = () => !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
function ptOf(el){
  if(!el || !el.getBoundingClientRect) return {x:innerWidth/2, y:innerHeight/2};
  const r = el.getBoundingClientRect(); return {x:r.left + r.width/2, y:r.top + r.height/2};
}
function burst(x, y, kind = "leaf"){
  const fx = $("#fx"); if(!fx || reduced()) return;
  const n = kind === "conf" ? 28 : kind === "spark" ? 12 : 16;
  for(let i = 0; i < n; i++){
    const p = document.createElement("i");
    p.className = "p " + (kind === "leaf" ? "p-leaf" : kind === "spark" ? "p-spark" : "p-conf c" + (i % 4));
    p.style.left = x + "px"; p.style.top = y + "px"; fx.appendChild(p);
    if(!p.animate){ p.remove(); continue }
    const a = Math.random() * Math.PI * 2, d = (kind === "conf" ? 90 : 55) + Math.random() * 60;
    const dx = Math.cos(a) * d, dy = Math.sin(a) * d - (kind === "conf" ? 30 : 15);
    p.animate([{transform:"translate(0,0) rotate(0deg) scale(1)", opacity:1},
      {transform:`translate(${dx}px,${dy + 50}px) rotate(${Math.random()*540 - 270}deg) scale(.6)`, opacity:0}],
      {duration:900 + Math.random() * 500, easing:"cubic-bezier(.15,.8,.3,1)"}).onfinish = () => p.remove();
  }
}
function floatText(x, y, text){
  const fx = $("#fx"); if(!fx) return;
  const el = document.createElement("span"); el.className = "floater"; el.textContent = text;
  el.style.left = x + "px"; el.style.top = y + "px"; el.style.transform = "translate(-50%,0)"; fx.appendChild(el);
  if(reduced() || !el.animate){ setTimeout(() => el.remove(), 1400); return }
  el.animate([{transform:"translate(-50%,0)", opacity:1}, {transform:"translate(-50%,-48px)", opacity:0}], {duration:1400, easing:"ease-out"}).onfinish = () => el.remove();
}

function snapshot(){ return {xp:totalXP(), streak:streakInfo()} }
function finish(snap, pt, kind){
  bonusCheck(snap.streak);
  checkBadges(false);
  const gained = totalXP() - snap.xp;
  const lv = levelInfo(totalXP()).L;
  if(lv > (S.seenLevel || 1)){ S.seenLevel = lv; queueOverlay({type:"level", L:lv}) }
  commit();
  if(pt && kind) burst(pt.x, pt.y, kind);
  if(pt && gained > 0) floatText(pt.x, pt.y - 16, `+${gained} XP`);
  if(gained > 0 || kind){
    cheer();
    const b = $("#bubble"); if(b) b.textContent = CHEERS[Math.floor(Math.random() * CHEERS.length)];

/* ---------- 보상 ---------- */
function pickReward(tier){
  let pool = S.rewards.filter(r => (r.tier || "small") === tier);
  if(!pool.length) pool = S.rewards;
  return pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
}
function drawReward(tier, reason, chance = 1){
  if(Math.random() > chance) return;
  const r = pickReward(tier);
  if(!r){
    toasts.push({kind:"info", text:`${reason}! 보상 탭에 나에게 줄 보상을 등록해 두면 이런 순간에 보상 상자가 열립니다.`});
    return;
  }
  S.earned.push({id:uid(), text:r.text, tier:r.tier || "small", date:iso(today()), reason, used:false});
  queueOverlay({type:"reward", text:r.text, reason, tier:r.tier || "small"});
}
function bonusCheck(before){
  if(before.todayActive) return;
  const after = streakInfo();
  if(after.count > 0 && after.count % 7 === 0) drawReward(after.count >= 28 ? "big" : "small", `연속 ${after.count}일`);
}
function completeMilestone(id){
  const s = S.season, m = s.milestones.find(x => x.id === id);
  if(!m) return;
  m.done = true; m.doneDate = iso(today());
  if(!m.rewarded){ m.rewarded = true; drawReward("small", "단계 완료") }
  if(s.milestones.length >= 3 && s.milestones.every(x => x.done) && !s.allDoneRewarded){
    s.allDoneRewarded = true; drawReward("big", "모든 단계 완료");
  }
}
function beep(){
  try{
    const ctx = audioCtx || (audioCtx = new (window.AudioContext || window.webkitAudioContext)());
    [0, .25, .5].forEach(t => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 660; g.gain.setValueAtTime(.12, ctx.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + t + .2);
      o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + .22);
    });
  }catch(_){}
}

  const frac = g.next ? (p - g.prev) / (g.next - g.prev) : 1;
  const wins = s.sessions.filter(x => x.win).slice(-5).reverse();
  const q = quests(), qd = q.filter(x => x.done).length, opened = S.chests.includes(iso(today()));
  const h = new Date().getHours(), sky = h >= 20 || h < 6 ? "night" : h >= 17 ? "eve" : "";
  const L = lines(), line = L[lineIdx % L.length];
  const stars = sky === "night" ? [[8,14],[22,30],[38,10],[64,22],[80,12],[92,34]].map(([x,y]) => `<i class="star" style="left:${x}%;top:${y}%"></i>`).join("") : "";
  const chestBtn = opened ? `<span class="chest">${icon("gift")}오늘 상자 열었음</span>`
    : qd === 3 ? `<button class="btn warn chest-ready" data-act="chest">${icon("gift")}상자 열기</button>`
    : `<span class="chest">${icon("lock")}${3 - qd}개 더 하면 상자</span>`;
  let streakMsg;

function focusCard(s){

  return `<article class="card" id="focus-card"><div><p class="eyebrow">오늘의 한 걸음</p><h3>지금 할 한 가지를 정하고 타이머를 켜세요</h3></div>

    <form id="focus-start">
      <label>어떤 단계를 위한 건가요?<select id="fs-ms"><option value="">단계 없이</option>${open.map(m =>
        `<option value="${m.id}">${esc(m.text)}${m.cue ? ` · ${esc(m.cue)}` : ""}</option>`).join("")}</select>

      <div><span class="lbl">시간</span><div class="choices" style="margin-top:5px">
        <label><input type="radio" name="fmin" value="5">5분만</label><label><input type="radio" name="fmin" value="25" checked>25분</label><label><input type="radio" name="fmin" value="50">50분</label></div>
        <p class="small muted" style="margin-top:6px">하기 싫은 날엔 5분만 하기로 하고 시작하세요. 가장 어려운 건 시작입니다.</p></div>
      ${S.bundle ? `<p class="small">작업할 때만 누리는 즐거움: <b>${esc(S.bundle)}</b></p>` : ""}

    </form>
    <p class="why">근거: "언제, 무엇을"까지 정한 구체적 계획(실행 의도)이 목표 달성률을 높인다는 메타분석(Gollwitzer &amp; Sheeran 2006). 멈춘 곳을 적어 두는 '재개 계획'이 다음 일로 넘어갈 때 남는 주의 잔여물을 줄인다는 연구(Leroy &amp; Glomb 2018).</p>
  </article>`;
}
function focusRunning(s){
  const fo = S.focus, m = s.milestones.find(x => x.id === fo.msId);
  const rem = Math.round(fo.start/1000 + fo.minutes*60 - Date.now()/1000);
  const frac = Math.min((Date.now() - fo.start) / (fo.minutes * 60000), 1);
  return `<article class="card" id="focus-card"><p class="eyebrow center">집중 세션 · ${fo.minutes}분</p>
    <div class="ring-wrap"><svg class="ring" viewBox="0 0 120 120" aria-hidden="true"><circle class="ring-bg" cx="60" cy="60" r="54"/>
      <circle class="ring-fg ${rem <= 0 ? "over" : ""}" id="fring" cx="60" cy="60" r="54" stroke-dasharray="${RING.toFixed(1)}" stroke-dashoffset="${(RING * (1 - frac)).toFixed(1)}" transform="rotate(-90 60 60)"/></svg>
      <div class="ring-center"><p class="bigtimer ${rem <= 0 ? "over" : ""}" id="ftimer" aria-live="off">${rem > 0 ? mmss(rem) : "+" + mmss(-rem)}</p><p class="small muted">${rem > 0 ? "남은 시간" : "초과 시간"}</p></div></div>
    <p class="center"><b>${esc(fo.goal)}</b>${m ? `<br><span class="small muted">단계: ${esc(m.text)}</span>` : ""}</p>
    <p class="small muted center" id="fstate">${rem > 0 ? "다른 탭이나 새 관심으로 옮기지 말고 이것 하나만." : "시간 다 됐어요. 아래에 오늘의 진전을 적고 기록하세요."}</p>
    ${S.bundle ? `<p class="small center">지금 누려도 되는 것: ${esc(S.bundle)}</p>` : ""}
    <form id="focus-park" class="row"><input type="text" id="fp-text" placeholder="딴생각이 떠오르면 여기 적고 돌아오기" aria-label="떠오른 생각" required><button class="btn ghost" type="submit" style="flex:0 0 auto">나중 목록에</button></form>
    <p class="small muted" id="fp-msg"></p>
    <form id="focus-end">
      <label>작은 진전 한 줄<span class="hint">크기와 상관없이 앞으로 나아간 것</span><input type="text" id="fe-win"></label>
      <label>다음에 이어갈 지점<span class="hint">멈춘 곳을 적어 두면 머리에서 내려놓기 쉽고 다음 시작이 빨라집니다</span><input type="text" id="fe-resume"></label>
      ${m ? `<label class="inline"><input type="checkbox" id="fe-done"><span>"${esc(m.text)}" 단계를 끝냈어요</span></label>` : ""}
      <div class="actions"><button class="btn" type="submit">세션 기록하기</button><button class="btn ghost" type="button" data-act="focus-cancel">기록 없이 취소</button></div>
    </form>
  </article>`;
}

function seasonCard(s){
  const w = weekNow(s), end = addDays(s.start, s.weeks*7 - 1);
  const dleft = Math.round((end - today())/86400000);
  const doneWeeks = new Set(s.checkins.map(c => c.week));
  const cells = Array.from({length:s.weeks}, (_,i) => {
    const n = i+1, cls = [doneWeeks.has(n) ? "done" : n < w ? "past" : "", n === w ? "now" : ""].join(" ");
    return `<div class="wk ${cls}" title="${n}주차">${n}</div>`;
  }).join("");
  let state;
  if(w < 1) state = `<div class="bigweek">시작 전<br><small>${fmtIso(s.start)} 시작</small></div>`;
  else if(w > s.weeks) state = `<div class="bigweek">기간 종료<br><small>마무리할 차례</small></div>`;
  else state = `<div class="bigweek">${w}<small> / ${s.weeks}주</small><br><small>공개까지 D-${Math.max(dleft,0)}</small></div>`;
  return `<article class="card">
    <div class="season-head"><div><p class="eyebrow">이번 시즌의 중심</p><h2>${esc(s.title)}</h2></div>${state}</div>
    <dl class="facts">
      <div><dt>만들 결과물</dt><dd>${esc(s.deliverable)}</dd></div>
      <div><dt>끝났다고 볼 기준</dt><dd>${esc(s.doneWhen)}</dd></div>
      <div><dt>공개 대상 · 공개일</dt><dd>${esc(s.audience || "정하지 않음")} · <span class="num">${fmt(end)}</span></dd></div>
      <div><dt>기록</dt><dd class="num">집중 ${s.sessions.length}회 · 체크인 ${doneWeeks.size}주</dd></div>
    </dl>
    <div class="weeks" style="--n:${s.weeks}">${cells}</div>
    <div class="legend"><span><i style="background:var(--moss);border-color:var(--moss)"></i>체크인한 주</span><span><i style="background:var(--line)"></i>지나간 주</span><span><i style="outline:2px solid var(--amber)"></i>이번 주</span></div>
    <div class="actions"><button class="btn ghost" data-act="season-edit">시즌 수정</button><button class="btn link danger" data-act="season-del">시즌 삭제</button></div>
  </article>`;
}

      : `<p class="muted small">예: 메일 유형 10개 정리하기, 화면 설계하기, 첫 버전 만들기, 친구 3명에게 보여 주기</p>`}

      <div class="row"><input type="text" id="ms-text" placeholder="단계" required aria-label="단계"><input type="text" id="ms-cue" placeholder="언제·어디서 (예: 평일 밤 9시, 식탁에서)" aria-label="언제 어디서"></div>

}

/* 복습 */
const GUIDE = `<details class="guide"><summary>왜 이렇게 복습하나요? 학습 원리 5가지</summary>
  <p class="small muted" style="margin-top:8px">따라 하며 매끄러운 건 '수행'입니다. 도움을 치운 뒤에도 남아 있고 처음 보는 문제에 쓸 수 있어야 '학습'입니다. 지금 편한 공부는 나중에 다시 배우게 만들고, 지금 조금 답답한 공부가 나중 반복을 줄입니다.</p>
  <div class="principles">
    <div><b>1. 인출</b>다시 읽지 말고 덮고 꺼내기. 막힌 곳이 공부할 위치. 꺼낸 뒤엔 반드시 답을 확인하기.<span class="src">Roediger &amp; Karpicke 2006. 일주일 뒤 기억은 반복 읽기보다 반복 인출 쪽이 더 높았다고 소개</span></div>
    <div><b>2. 간격</b>하루에 몰지 말고 나눠서. 오늘 밤, 1일, 3일, 7일을 출발점으로, 잘 되면 늘리고 틀리면 당기기.<span class="src">Cepeda 외 2006 분산 학습 메타분석</span></div>
    <div><b>3. 교차</b>헷갈리는 비슷한 유형을 섞어서. 카드는 묶음별로 번갈아 나옵니다. 아무거나 1분마다 바꾸는 건 교차가 아님.<span class="src">Rohrer 외 2014, 7학년 수학에서 교차 72% · 묶음 38%로 소개</span></div>
    <div><b>4. 자기 설명</b>자료를 덮고 처음 듣는 사람에게 90초 설명. 무엇인지, 왜 그런지, 언제 안 통하는지, 내 예시는?<span class="src">Chi 외 1989. 초보는 예시부터 보고 도움을 점점 줄이기</span></div>
    <div><b>5. 연결</b>새 사실을 허공에 두지 말고 아는 구조에 걸기. 전문가는 낱개가 아니라 의미 있는 덩어리로 봅니다.<span class="src">Chase &amp; Simon 1973 체스 기억 실험</span></div>
    <div><b>좋은 어려움의 4조건</b>실제 목표와 같을 것 · 노력하면 성공할 수 있을 것 · 피드백이 있을 것 · 잠과 휴식으로 회복할 것.<span class="src">Bjork의 '바람직한 어려움'. '나는 영상형' 같은 학습 유형 맞춤은 근거가 부족하다는 검토(Pashler 외 2008)</span></div>
  </div>
</details>`;
function sessionView(){
  const c = S.cards.find(x => x.id === session.queue[session.i]);
  if(!c){ session = null; return recallView() }
  const hardD = STEPS[1], okD = Math.max(STEPS[nextStep(c,"ok")],1), easyD = Math.max(STEPS[nextStep(c,"easy")],1);
  return `<div class="flash">
    <div class="row" style="align-items:center"><p class="eyebrow" style="flex:1 1 auto">꺼내기 <span class="num">${session.i+1} / ${session.queue.length}</span>${c.tag ? ` · ${esc(c.tag)}` : ""}</p>
      <button class="btn link" data-act="sess-stop" style="flex:0 0 auto">그만하기</button></div>
    <div class="prompt">${esc(c.prompt)}</div>
    ${!session.revealed ? `
      <p class="small muted">자료를 보지 말고 기억나는 대로 적거나 소리 내어 설명해 보세요. 막힌 곳이 공부할 위치입니다.</p>
      <textarea id="attempt" placeholder="기억나는 것 (비워 둬도 됩니다)">${esc(session.attempt)}</textarea>
      <div class="actions"><button class="btn ghost" data-act="timer">90초 설명 시작</button><span class="timer" id="timer" aria-live="polite"></span></div>
      <div class="actions"><button class="btn" data-act="reveal">답 확인하기</button></div>`
    : `
      ${session.attempt ? `<div><p class="eyebrow">내가 꺼낸 것</p><div class="mine">${esc(session.attempt)}</div></div>` : ""}
      <div><p class="eyebrow">정리해 둔 답</p><div class="answer">${esc(c.notes || "(적어 둔 답이 없습니다)")}</div></div>
      ${c.conn || c.principle || c.change ? `<dl class="facts small">
        ${c.conn ? `<div><dt>연결되는 것</dt><dd>${esc(c.conn)}</dd></div>` : ""}
        ${c.principle ? `<div><dt>더 큰 원리</dt><dd>${esc(c.principle)}</dd></div>` : ""}
        ${c.change ? `<div><dt>조건이 바뀌면</dt><dd>${esc(c.change)}</dd></div>` : ""}</dl>` : ""}
      <p class="small muted">빠뜨린 것과 틀린 것을 비교해 보세요. 틀린 채로 넘어가면 오류가 굳습니다.</p>
      <div class="rate">
        <button class="hard" data-act="rate" data-r="hard">막혔어요<small>${hardD}일 뒤</small></button>
        <button data-act="rate" data-r="ok">겨우 떠올렸어요<small>${okD}일 뒤</small></button>
        <button class="easy" data-act="rate" data-r="easy">쉽게 떠올렸어요<small>${easyD}일 뒤</small></button>
      </div>`}
  </div>`;
}
function recallView(){
  if(session) return sessionView();
  const due = dueCards(), p = cardPrefill || {}, t = iso(today());
  const tags = [...new Set(S.cards.map(c => c.tag).filter(Boolean))];
  const list = [...S.cards].sort((a,b) => a.due.localeCompare(b.due));
  return `
  <article class="card">
    <div class="season-head"><div><p class="eyebrow">오늘의 인출 연습</p><h3>${due.length ? `꺼내볼 것이 ${due.length}개 있어요` : "오늘 꺼낼 카드를 다 봤어요"}</h3></div>
      ${due.length ? `<button class="btn" data-act="sess-start">복습 시작</button>` : ""}</div>
    <p class="small muted">${due.length ? "비슷한 묶음끼리 번갈아 나오도록 섞어서 냅니다. 5분이면 충분해요." : list.length ? `다음 복습은 ${fmtIso(list[0].due)}입니다. 오늘 새로 배운 게 있다면 아래에 카드로 남겨 두세요.` : "오늘 배운 것을 카드로 만들면 오늘 밤, 1일, 3일, 7일 뒤에 다시 꺼내도록 알려 줍니다."}</p>
  </article>
  <article class="card">
    <div><h3>배운 것을 카드로 남기기</h3><p class="small muted">질문이나 과제 형태로 적으세요. "단축키 정리"보다 "빈 화면에서 컷 전환 3가지 만들어 보기"가 좋습니다.</p></div>
    <form id="card-add">
      <label>꺼내 볼 질문 또는 과제<input type="text" id="k-prompt" required value="${esc(p.prompt)}" placeholder="예: 회의 일정 변경을 요청하는 영어 메일 첫 문장 쓰기"></label>
      <label>정리해 둔 답<span class="hint">복습할 때 확인용으로만 보입니다</span><textarea id="k-notes"></textarea></label>
      <label>묶음<span class="hint">헷갈리기 쉬운 것끼리 같은 묶음으로 두면 섞어서 나옵니다</span>
        <input type="text" id="k-tag" list="k-tags" placeholder="예: 영어 메일, 전장 설계"><datalist id="k-tags">${tags.map(x => `<option value="${esc(x)}">`).join("")}</datalist></label>
      <details class="more"><summary>연결 질문 (선택): 새 지식을 아는 구조에 걸기</summary>
        <div style="display:flex;flex-direction:column;gap:12px">
          <label>내가 아는 무엇과 연결되나요?<input type="text" id="k-conn"></label>
          <label>어떤 더 큰 원리의 사례인가요?<input type="text" id="k-principle"></label>
          <label>조건이 달라지면 결과는 어떻게 바뀌나요?<input type="text" id="k-change"></label>
        </div></details>
      <div class="actions"><button class="btn" type="submit">카드 추가 (오늘 밤 첫 복습)</button></div>
    </form>
  </article>
  ${list.length ? `<article class="card"><h3>카드 <span class="num muted">${list.length}</span></h3><ul class="list">${list.map(c => {
    const last = c.reviews[c.reviews.length-1];
    return li("card", c, `<div class="grow"><b>${esc(c.prompt)}</b><br><span class="small muted">${c.tag ? esc(c.tag) + " · " : ""}<span class="num">${c.due <= t ? "오늘" : fmtIso(c.due)}</span> 복습 · 꺼낸 횟수 <span class="num">${c.reviews.length}</span>${last ? ` · 최근: ${{hard:"막힘",ok:"겨우",easy:"쉬움"}[last.r]}` : ""}</span></div>`);
  }).join("")}</ul></article>` : ""}
  ${GUIDE}`;
}

/* 체크인 */
function checkinView(){
  const s = S.season, w = clampWeek(s), has = s.checkins.some(c => c.week === w);
  const list = [...s.checkins].sort((a,b) => b.week - a.week || b.date.localeCompare(a.date));
  const stuckLabel = {none:"막힌 곳 없었음", stayed:"막혔지만 버팀", left:"막혀서 피함"};
  return `
  <article class="card">
    <div><p class="eyebrow">${w}주차 체크인 ${has ? '<span class="pill moss">이번 주 기록 있음</span>' : ""}</p><h3>이번 주를 돌아보고, 관심사 사이에 다리를 하나 놓으세요</h3></div>
    <form id="checkin">

      <label>강의·자료 없이 혼자 해 본 것<span class="hint">따라 하며 된 건 '수행', 도움을 치운 뒤 남은 게 '학습'입니다</span><textarea id="c-solo"></textarea></label>
      <label>막힌 지점<span class="hint">다음에 공부할 위치입니다. 적어 두면 복습 카드로 바꿀 수 있어요</span><input type="text" id="c-gap"></label>

      <label>1. 이번 주에 배운 원리는 내 본업의 어떤 문제와 닮았나요?<textarea id="c-q1"></textarea></label>

      <label>3. 두 분야를 합쳐 다음 주에 해볼 작은 실험은?<span class="hint">적용한 버전과 안 한 버전을 비교할 수 있게</span><textarea id="c-exp"></textarea></label>
      <label>지난 실험 결과<textarea id="c-res"></textarea></label>

    <p class="why">근거: 연결은 저절로 생기지 않고 "이 구조를 어디서 봤지?"라는 의식적 질문에서 생긴다는 유추 연구. 직관은 연결에서 시작하지만 실력은 검증에서 완성됩니다.</p>

  ${list.length ? `<article class="card"><h3>지난 기록</h3>${list.map(c => isEditing("checkin", c.id)

        <span class="pill ${c.stuck === "left" ? "amber" : c.stuck === "stayed" ? "moss" : ""}" style="flex:0 0 auto">${stuckLabel[c.stuck] || ""}</span>${itemBtns("checkin", c.id)}</div>
      <dl>

        ${c.solo ? `<dt>혼자 해 본 것</dt><dd>${esc(c.solo)}</dd>` : ""}
        ${c.gap ? `<dt>막힌 지점</dt><dd>${esc(c.gap)} ${S.cards.some(k => k.fromCheckin === c.id) ? '<span class="pill moss">카드 있음</span>' : `<button class="btn link" style="color:var(--moss)" data-act="gap-card" data-id="${c.id}">복습 카드로 만들기</button>`}</dd>` : ""}
        ${c.mix || c.rest ? `<dt>연습 방식</dt><dd>${[c.mix ? "섞어서 연습" : "", c.rest ? "잠·휴식 챙김" : ""].filter(Boolean).join(" · ")}</dd>` : ""}

function goTab(k){
  tab = k; reviewing = false; session = null; editing = null; editingSeason = false; confirmDelete = false; toasts = []; undo = null; stopTimer();
  try{ localStorage.setItem("season-tab", tab) }catch(_){}

}
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-tab],[data-act],[data-sub]"); if(!t) return;
  if(t.dataset.tab){ goTab(t.dataset.tab); $("#panel")?.scrollIntoView({block:"start"}); return }
  if(t.dataset.sub){ sub = t.dataset.sub; editing = null; try{ localStorage.setItem("season-sub", sub) }catch(_){} render(); return }
  const a = t.dataset.act, id = t.dataset.id, s = S.season, pt = ptOf(t);
  if(a === "ov-close"){ closeOverlay(); return }
  if(a === "poke"){
    lineIdx++; const b = $("#bubble");
    if(b){ const L = lines(); b.textContent = L[lineIdx % L.length] }
    cheer(1200); burst(pt.x, pt.y - 20, "spark"); return;
  }
  if(a === "goto-steps"){ goTab("season"); $("#ms-text")?.scrollIntoView({block:"center"}); $("#ms-text")?.focus({preventScroll:true}); return }
  if(a === "goto-focus"){ $("#focus-card")?.scrollIntoView({behavior: reduced() ? "auto" : "smooth", block:"start"}); $("#fs-goal")?.focus({preventScroll:true}); return }
  if(a === "chest"){
    const snap = snapshot(), r = pickReward("small");
    S.chests.push(iso(today()));
    if(r) S.earned.push({id:uid(), text:r.text, tier:r.tier || "small", date:iso(today()), reason:"오늘의 상자", used:false});
    queueOverlay({type:"chest", text:r ? r.text : ""});
    finish(snap, pt, "spark"); return;
  }
  if(a === "toast-close"){ toasts = []; undo = null; render() }
  if(a === "edit"){ editing = {type:t.dataset.type, id}; render(); document.querySelector(".edit-form input,.edit-form textarea")?.focus() }
  if(a === "edit-cancel"){ editing = null; render() }
  if(a === "del"){
    const arr = coll(t.dataset.type), i = arr ? arr.findIndex(x => x.id === id) : -1;
    if(i < 0) return;
    undo = {type:t.dataset.type, item:arr[i], index:i}; arr.splice(i, 1);
    if(editing?.id === id) editing = null;
    commit();
  }
  if(a === "undo" && undo){ const arr = coll(undo.type); if(arr) arr.splice(Math.min(undo.index, arr.length), 0, undo.item); undo = null; commit() }
  if(a === "ms-toggle"){
    const snap = snapshot(), m = s.milestones.find(x => x.id === id);
    if(t.checked) completeMilestone(id); else { m.done = false; m.doneDate = null }
    finish(snap, pt, t.checked ? "leaf" : null);
  }
  if(a === "earned-use"){ const x = S.earned.find(v => v.id === id); x.used = t.checked; commit() }
  if(a === "season-edit"){ tab = "season"; editingSeason = true; render(); window.scrollTo({top:0}) }
  if(a === "season-edit-cancel"){ editingSeason = false; render() }
  if(a === "season-del"){ confirmDelete = true; render() }
  if(a === "season-del-no"){ confirmDelete = false; render() }
  if(a === "season-del-yes"){ S.season = null; S.focus = null; confirmDelete = false; tab = "today"; toasts = [{kind:"info", text:"시즌을 삭제했어요. 새 시즌을 시작하세요."}]; commit() }
  if(a === "new-interest"){ goTab("more"); sub = "later"; render(); $("#l-title")?.focus() }
  if(a === "review"){ tab = "season"; reviewing = true; render(); window.scrollTo({top:0}) }
  if(a === "review-cancel"){ reviewing = false; render() }
  if(a === "pick"){ const l = S.later.find(x => x.id === id); prefill = {title:l.title, deliverable:l.output || "", pickId:l.id}; render() }
  if(a === "focus-cancel"){ S.focus = null; commit() }
  if(a === "gap-card"){ const c = s.checkins.find(x => x.id === id); goTab("recall"); cardPrefill = {prompt:c.gap, fromCheckin:c.id}; render(); $("#k-notes")?.focus() }
  if(a === "sess-start"){ session = {queue:interleave(dueCards()), i:0, revealed:false, attempt:""}; render(); $("#attempt")?.focus() }
  if(a === "sess-stop"){ session = null; stopTimer(); render() }
  if(a === "reveal"){ stopTimer(); session.revealed = true; render() }
  if(a === "timer"){
    stopTimer(); let n = 90; const el = $("#timer"); el.textContent = "1:30";
    timerId = setInterval(() => {
      n--; if(!el.isConnected){ stopTimer(); return }
      el.textContent = n > 0 ? mmss(n) : "끝! 막힌 곳이 있었다면 거기가 공부할 위치입니다";
      if(n <= 0) stopTimer();
    }, 1000);
  }
  if(a === "rate"){
    const snap = snapshot(), c = S.cards.find(x => x.id === session.queue[session.i]), r = t.dataset.r;
    c.step = nextStep(c, r); c.due = daysAfter(Math.max(STEPS[c.step], 1));
    c.reviews = [...c.reviews, {date:iso(today()), r}].slice(-40);
    session.i++; session.revealed = false; session.attempt = "";
    const done = session.i >= session.queue.length;
    if(done){ session = null; toasts.push({kind:"info", text:"오늘 복습을 마쳤어요. 막혔던 카드는 내일 다시 나옵니다."}) }
    finish(snap, pt, done ? "conf" : "spark"); $("#attempt")?.focus();
  }
  if(a === "copy-pitch"){
    const txt = $("#p-out").innerText, msg = $("#copy-msg");
    try{ await navigator.clipboard.writeText(txt); msg.textContent = "복사했습니다" }
    catch(_){ const r = document.createRange(); r.selectNodeContents($("#p-out")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); msg.textContent = "선택해 두었습니다. Ctrl+C로 복사하세요" }
  }
});

document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target, v = id => (f.querySelector("#" + id)?.value || "").trim(), s = S.season, pt = ptOf(e.submitter || f);
  if(f.classList.contains("edit-form")){
    const arr = coll(f.dataset.type), o = arr && arr.find(x => x.id === f.dataset.id);

    editing = null; commit(); return;
  }

    const d = readSeasonForm(f), warns = [];
    if(many(d.title)) warns.push("중심 분야에 여러 가지가 들어 있는 것 같아요. 이번 계절의 중심은 하나로 두고, 나머지는 나중 목록에 대기시키거나 조연 관심사로 붙여 보세요.");
    if(many(d.deliverable)) warns.push("결과물이 여러 개인 것 같아요. 이번 시즌에 끝낼 결과물 하나를 고르세요.");
    if(vague(d.deliverable)) warns.push(`"${esc(d.deliverable)}"는 끝이 보이지 않는 표현 같습니다. 완성하면 손에 남는 것으로 바꿔 보세요.`);
    if(warns.length && f.dataset.warned !== "1"){
      f.dataset.warned = "1";
      $("#setup-warn").innerHTML = warns.map(w => `<div class="note warn">${w}</div>`).join("") + `<p class="small muted" style="margin-top:6px">그대로 진행하려면 한 번 더 누르세요.</p>`;
      return;
    }
    if(f.id === "setup"){
      S.season = {id:uid(), ...d, milestones:[], supports:[], checkins:[], sessions:[]};
      if(prefill?.pickId) S.later = S.later.filter(x => x.id !== prefill.pickId);
      prefill = null; tab = "today";
    } else { Object.assign(S.season, d); editingSeason = false }
    commit(); window.scrollTo({top:0}); return;
  }
  if(f.id === "focus-start"){
    try{ audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)() }catch(_){}
    S.focus = {start:Date.now(), minutes:Number(f.querySelector("input[name=fmin]:checked").value), goal:v("fs-goal"), msId:v("fs-ms") || null};
    beeped = false; commit(); return;

    checkBadges(false); persist(); flushOverlays(); return;
  }
  if(f.id === "focus-end"){
    const fo = S.focus, snap = snapshot(), elapsed = (Date.now() - fo.start) / 1000, full = elapsed >= fo.minutes * 60 * .9;
    s.sessions.push({id:uid(), date:iso(today()), minutes:Math.max(1, Math.round(elapsed/60)), planned:fo.minutes, goal:fo.goal, msId:fo.msId, win:v("fe-win"), resume:v("fe-resume"), full});
    if(fo.msId && f.querySelector("#fe-done")?.checked) completeMilestone(fo.msId);
    S.focus = null;
    toasts.push({kind:"info", text: full ? `${fo.minutes}분 집중을 끝까지 해냈어요.` : "짧아도 시작한 게 중요합니다. 기록했어요."});
    if(full) drawReward("small", "집중 세션 완주", .3);
    finish(snap, pt, "leaf"); return;
  }
  if(f.id === "ms-add"){ s.milestones.push({id:uid(), text:v("ms-text"), cue:v("ms-cue"), done:false}); commit(); $("#ms-text")?.focus(); return }
  if(f.id === "sup-add"){ s.supports.push({id:uid(), name:v("sup-name"), role:v("sup-role")}); commit(); return }
  if(f.id === "checkin"){
    const snap = snapshot();
    s.checkins.push({id:uid(), week:clampWeek(s), date:iso(today()), did:v("c-did"), stuck:f.querySelector("input[name=stuck]:checked").value,
      solo:v("c-solo"), gap:v("c-gap"), mix:f.querySelector("#c-mix").checked, rest:f.querySelector("#c-rest").checked,
      q1:v("c-q1"), q2:v("c-q2"), exp:v("c-exp"), res:v("c-res")});
    drawReward("small", "주간 체크인", .5); finish(snap, pt, "leaf"); window.scrollTo({top:0}); return;
  }
  if(f.id === "card-add"){
    const snap = snapshot();
    S.cards.push({id:uid(), prompt:v("k-prompt"), notes:v("k-notes"), tag:v("k-tag"), conn:v("k-conn"), principle:v("k-principle"), change:v("k-change"),
      created:iso(today()), due:iso(today()), step:0, reviews:[], fromCheckin:cardPrefill?.fromCheckin || null});
    cardPrefill = null; finish(snap, pt, "spark"); return;
  }
  if(f.id === "later-add"){
    S.later.push({id:uid(), title:v("l-title"), why:v("l-why"), output:v("l-out"), avoid:f.querySelector("#l-avoid").checked, date:iso(today())});
    commit(); return;
  }
  if(f.id === "reward-add"){ S.rewards.push({id:uid(), text:v("r-text"), tier:v("r-tier") || "small"}); commit(); $("#r-text")?.focus(); return }
  if(f.id === "bundle-form"){ S.bundle = v("b-text"); toasts = [{kind:"info", text:"저장했어요. 집중 세션 화면에 보여 줍니다."}]; commit(); return }
  if(f.id === "review"){
    const snap = snapshot(), answers = CHECKS.map((_,i) => f.querySelector(`input[name=c${i}]:checked`).value === "y");
    const decision = f.querySelector("input[name=dec]:checked").value;
    S.archive.push({...s, endedAt:iso(today()), review:{answers, decision, note:v("r-note")}});
    drawReward("big", "시즌 마무리");
    prefill = decision === "deeper" ? {title:s.title} : null;
    S.season = null; S.focus = null; reviewing = false; tab = "today"; finish(snap, pt, "conf"); window.scrollTo({top:0});
  }
});

document.addEventListener("change", e => {
  const f = e.target.closest("#review"); if(!f) return;
  const noes = CHECKS.filter((_,i) => f.querySelector(`input[name=c${i}]:checked`)?.value === "n").length;
  $("#review-note").innerHTML = noes >= 3 ? `<div class="note warn">'아니요'가 ${noes}개입니다. 다음 시즌은 새 분야보다 이번 결과물을 작게 줄여서라도 끝내는 쪽을 먼저 고려해 보세요.</div>` : "";
});
document.addEventListener("input", e => {
  if(e.target.id === "attempt" && session){ session.attempt = e.target.value; return }
  const map = {"p-who":"who","p-prob":"problem","p-combo":"combo"}, k = map[e.target.id];
  if(!k) return;
  S.pitch[k] = e.target.value; $("#p-out").innerHTML = pitchText(S.pitch); persist();
});

document.addEventListener("keydown", e => { if(e.key === "Escape" && overlayOpen) closeOverlay() });

/* 집중 타이머: 화면의 숫자만 갱신한다 (입력 중인 글을 지우지 않도록 다시 그리지 않음) */
setInterval(() => {
  const el = $("#ftimer"); if(!el || !S.focus) return;
  const rem = Math.round(S.focus.start/1000 + S.focus.minutes*60 - Date.now()/1000);
  const ring = $("#fring");
  if(ring) ring.style.strokeDashoffset = (RING * (1 - Math.min((Date.now() - S.focus.start) / (S.focus.minutes * 60000), 1))).toFixed(1);
  if(rem > 0){ el.textContent = mmss(rem); return }
  el.textContent = "+" + mmss(-rem); el.classList.add("over"); if(ring) ring.classList.add("over");
  const st = $("#fstate"); if(st) st.textContent = "시간 다 됐어요. 아래에 오늘의 진전을 적고 기록하세요.";
  if(!beeped){ beeped = true; beep() }
}, 1000);

/* ---------- 시작 ---------- */
async function boot(){
  let db = null;
  try{ db = window.claude && window.claude.use ? await window.claude.use("db") : null }catch(_){ db = null }
  if(db){
    try{
      docRef = db.doc("app/state");
      const snap = await docRef.get();
      if(snap.exists) S = merge(snap.data().state);
      backend = "db";
    }catch(_){ docRef = null }
  }
  if(!docRef){
    try{ const raw = localStorage.getItem("season-app"); if(raw) S = merge(JSON.parse(raw)) }catch(_){}
    backend = "local";
  }
  if(S.focus && Date.now() > S.focus.start + S.focus.minutes*60000) beeped = true;
  /* 이미 달성한 배지와 레벨은 조용히 반영한다 (다음 행동 때 함께 저장) */
  checkBadges(true);
  if(S.seenLevel == null) S.seenLevel = levelInfo(totalXP()).L;
  ready = true; setStatus(backend === "db" ? "ok" : "", where()); render();
}
boot();
})();
</script>
